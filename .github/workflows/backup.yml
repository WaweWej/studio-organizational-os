name: Backup database

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the database
        run: |
          npm install --no-save wrangler > /dev/null 2>&1
          npx wrangler d1 export studio-d1 --remote --output "studio-$(date -u +%Y-%m-%d).sql"
      - name: Keep the export
        uses: actions/upload-artifact@v4
        with:
          name: studio-backup-${{ github.run_id }}
          path: studio-*.sql
          retention-days: 90
          if-no-files-found: error
