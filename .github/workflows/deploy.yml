name: Deploy to Cloudflare

on:
  push:
    branches: [codex/client-focus]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Provision database if missing
        run: npx wrangler d1 create studio-d1 2>&1 | tail -2 || true

      - name: Provision bucket if the account has R2
        id: r2
        run: |
          OUT=$(npx wrangler r2 bucket create studio-r2 2>&1 || true)
          echo "$OUT" | tail -2
          if echo "$OUT" | grep -q "10042"; then
            echo "mode=no-r2" >> "$GITHUB_OUTPUT"
            echo "R2 is not enabled on this account; deploying with database file storage."
          else
            echo "mode=with-r2" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve database id
        id: d1
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const db=JSON.parse(d).find(x=>x.name==='studio-d1');if(!db)process.exit(1);console.log(db.uuid)})")
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Prepare production config
        run: node scripts/prepare-deploy.mjs "${{ steps.d1.outputs.id }}" "${{ steps.r2.outputs.mode }}"

      - name: Apply migrations
        run: npx wrangler d1 migrations apply studio-d1 --remote --config dist/server/wrangler.json

      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
